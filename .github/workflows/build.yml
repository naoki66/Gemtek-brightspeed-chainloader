name: Build AN7581 U-Boot (XR1710G / XG2010G)

# Multi-board cloud build, modeled on the uboot-an758x CI layout:
#   * a matrix over the supported boards
#   * one shared build helper (scripts/build.sh) invoked per board
#   * per-board artifacts + an optional GitHub Release
#
# This repository builds U-Boot only -- no TF-A / BL2 / FIP signing (the
# recovery U-Boot is flashed through the existing chainloader). The XR1710G
# board additionally packages a chainloader slot image, which is the artifact
# actually flashed through HTTP Recovery.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: Build only, create a pre-release, or create a release
        required: true
        default: test
        type: choice
        options:
          - test
          - pre-release
          - release

env:
  CROSS_COMPILE: aarch64-linux-gnu-
  ARCH: arm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: xr1710g
          - target: xg2010g
    outputs:
      build_mode: ${{ steps.mode.outputs.value }}
      commit: ${{ steps.version.outputs.commit }}
      release_date: ${{ steps.version.outputs.release_date }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select build mode
        id: mode
        env:
          REQUESTED_MODE: ${{ github.event.inputs.release_type }}
        run: |
          MODE="${REQUESTED_MODE:-test}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            MODE="test"
          fi
          case "$MODE" in
            test|pre-release|release) ;;
            *)
              echo "Unsupported build mode: $MODE" >&2
              exit 1
              ;;
          esac
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "Build mode: $MODE"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            build-essential \
            bison \
            flex \
            swig \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            libssl-dev \
            device-tree-compiler \
            bc

      - name: Build U-Boot (${{ matrix.target }})
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ matrix.target }}"

      - name: Package chainloader slot (${{ matrix.target }})
        run: |
          chmod +x chainloader/build-chainloader-fit.sh
          ./chainloader/build-chainloader-fit.sh \
            "output/${{ matrix.target }}/u-boot.bin" \
            out \
            "build/${{ matrix.target }}/tools/mkimage" \
            "build/${{ matrix.target }}/tools/dumpimage" \
            "${{ matrix.target }}"
          ls -la out/

      - name: Get version info
        id: version
        run: |
          COMMIT_SHORT=$(git rev-parse --short=12 HEAD)
          DATE=$(date +%Y%m%d)
          VERSION=$(sed -n 's/.*PLAIN_VERSION "\(.*\)".*/\1/p' \
            "build/${{ matrix.target }}/include/generated/version_autogenerated.h" \
            2>/dev/null | head -1)
          if [ -z "$VERSION" ]; then
            VERSION=$(date +%Y.%m)
          fi
          echo "commit=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          RELEASE_DATE=$(date +%Y-%-m-%-d)
          echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts (${{ matrix.target }})
        run: |
          mkdir -p build-output
          # Publish exactly two files per board:
          #   * <board>-chainloader-slot.bin — flash via HTTP Recovery `uboot` target
          #   * <board>-chainloader.itb     — RAM-only TFTP validation, never upload
          cp out/${{ matrix.target }}-chainloader-slot.bin \
            "build-output/${{ matrix.target }}-chainloader-slot.bin"
          cp out/${{ matrix.target }}-chainloader.itb \
            "build-output/${{ matrix.target }}-chainloader.itb"
          {
            echo "Build target: ${{ matrix.target }}"
            echo "Build date: $(date)"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Commit short: $(git rev-parse --short HEAD)"
            echo "Ref: ${GITHUB_REF_NAME}"
            echo "Build mode: ${{ steps.mode.outputs.value }}"
            echo "U-Boot version: ${{ steps.version.outputs.version }}"
          } > "build-output/${{ matrix.target }}-build-info.txt"
          sha256sum build-output/* > "build-output/${{ matrix.target }}-sha256sums.txt" \
            2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uboot-${{ matrix.target }}
          path: build-output/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.build_mode != 'test' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: uboot-*
          path: release-output
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: ${{ needs.build.outputs.build_mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_date }}-${{ needs.build.outputs.commit }}
          RELEASE_TITLE: AN7581 U-Boot ${{ needs.build.outputs.version }}-${{ needs.build.outputs.release_date }}-g${{ needs.build.outputs.commit }}
        run: |
          NOTES_FILE=$(mktemp)
          {
            echo "Automated build from commit [\`${{ needs.build.outputs.commit }}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "**Release channel / 发布通道:** ${RELEASE_MODE}"
            echo
            echo "## 文件说明 / Files"
            echo
            echo "每个机型仅发布 2 个文件。Each board ships exactly two files:"
            echo
            echo "| 文件 File | 说明 Description |"
            echo "|---|---|"
            echo "| \`xr1710g-chainloader-slot.bin\` / \`xg2010g-chainloader-slot.bin\` | 唯一用于刷机的镜像：通过 HTTP Recovery 的 \`uboot\` 目标写入 chainloader 分区（偏移 0x600000，1 MiB）。The only image to flash: write through the HTTP Recovery \`uboot\` target (offset 0x600000, 1 MiB). |"
            echo "| \`xr1710g-chainloader.itb\` / \`xg2010g-chainloader.itb\` | 仅用于 TFTP RAM 验证启动，请勿通过 HTTP Recovery 上传。RAM-only validation through TFTP. Do not upload this file to HTTP Recovery. |"
            echo
            echo "刷机教程 / Flashing guide: [XR1710G](docs/flashing-xr1710g.md) · [XG2010G](docs/flashing-xg2010g.md)"
            echo
            echo "## SHA256"
            echo
            echo '```text'
            cat release-output/*-sha256sums.txt 2>/dev/null || true
            echo '```'
          } > "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_MODE" = "pre-release" ]; then
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --prerelease \
                --latest=false
            else
              gh release edit "$RELEASE_TAG" \
                --target "$GITHUB_SHA" \
                --title "$RELEASE_TITLE" \
                --notes-file "$NOTES_FILE" \
                --prerelease=false \
                --latest
            fi
            gh release upload "$RELEASE_TAG" release-output/* --clobber
          elif [ "$RELEASE_MODE" = "pre-release" ]; then
            gh release create "$RELEASE_TAG" release-output/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" release-output/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
